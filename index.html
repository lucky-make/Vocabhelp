<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>German Placement Test</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:640px;margin:0 auto;padding:20px;background:#111;color:#eee;line-height:1.5}
  h1{font-size:20px}
  .q{margin:18px 0;padding:14px;background:#1c1c1c;border-radius:8px}
  .q p{margin:0 0 10px;font-weight:600}
  label{display:block;padding:6px 8px;margin:4px 0;border-radius:6px;cursor:pointer}
  label:hover{background:#2a2a2a}
  button{margin-top:16px;padding:12px 20px;font-size:16px;border:0;border-radius:8px;background:#4a9;color:#000;font-weight:700;cursor:pointer}
  #result{margin-top:20px;padding:16px;border-radius:8px;background:#1c1c1c;display:none;font-size:17px}
  .lv{font-size:22px;font-weight:800;color:#4a9}
  .wrong{color:#e77}
</style>
</head>
<body>
<h1>German Placement Test — A1 bis B1</h1>
<p>Kein Wörterbuch. Raten ist okay.</p>
<div id="quiz"></div>
<button onclick="grade()">Auswerten</button>
<div id="result"></div>

<script>
const Q = [
 {q:"Ich ___ Anna.", a:["bist","bin","ist","sind"], c:1},
 {q:"___ kommst du?", a:["Wo","Woher","Wohin","Was"], c:1},
 {q:"Das ist ___ Buch.", a:["eine","einen","ein","einem"], c:2},
 {q:"Ich habe zwei ___.", a:["Bruder","Brüder","Bruders","Brudern"], c:1},
 {q:"Ich fahre ___ dem Bus.", a:["in","auf","mit","bei"], c:2},
 {q:"Gestern ___ ich ins Kino gegangen.", a:["habe","bin","war","hatte"], c:1},
 {q:"Ich interessiere mich ___ Musik.", a:["an","für","auf","über"], c:1},
 {q:"Wenn ich Zeit ___, komme ich mit.", a:["hätte","hatte","habe","haben"], c:2},
 {q:"Der Mann, ___ ich gestern getroffen habe, ist mein Chef.", a:["dem","den","der","dessen"], c:1},
 {q:"Ich lasse mein Auto ___.", a:["repariert","reparieren","zu reparieren","reparieren lassen"], c:1},
 {q:"___ ich früher komme, kann ich helfen.", a:["Als","Wenn","Ob","Damit"], c:1},
 {q:"Das ist der Kollege, ___ mir geholfen hat.", a:["den","dem","der","dessen"], c:2},
 {q:"Er tut so, ___ er alles wüsste.", a:["wie","dass","als","ob"], c:2},
 {q:"Trotz ___ Regens gingen wir spazieren.", a:["dem","des","der","den"], c:1},
 {q:"Nachdem ich ___, ging ich schlafen.", a:["gegessen habe","gegessen hatte","aß","esse"], c:1},
 {q:"Ich habe vergessen, die Tür ___.", a:["abschließen","abgeschlossen","abzuschließen","zu abschließen"], c:2}
];

const quiz = document.getElementById("quiz");
Q.forEach((item,i)=>{
  const d = document.createElement("div");
  d.className = "q";
  let h = "<p>"+(i+1)+". "+item.q+"</p>";
  item.a.forEach((opt,j)=>{
    h += '<label><input type="radio" name="q'+i+'" value="'+j+'"> '+opt+'</label>';
  });
  d.innerHTML = h;
  quiz.appendChild(d);
});

function grade(){
  let score = 0, unanswered = 0, detail = "";
  Q.forEach((item,i)=>{
    const sel = document.querySelector('input[name="q'+i+'"]:checked');
    if(!sel){ unanswered++; detail += "<div class='wrong'>"+(i+1)+". nicht beantwortet — richtig: "+item.a[item.c]+"</div>"; return; }
    if(parseInt(sel.value) === item.c){ score++; }
    else { detail += "<div class='wrong'>"+(i+1)+". falsch — richtig: "+item.a[item.c]+"</div>"; }
  });

  let level, advice;
  if(score <= 4){ level="A1"; advice="Du musst bei A1 anfangen. B2 bis Dezember ist nicht realistisch. Ziel: B1 bis Mitte 2027."; }
  else if(score <= 8){ level="A2"; advice="B2 bis Dezember ist nicht realistisch. Realistisch: B1. Wenn du 3 Std/Tag machst, vielleicht B1 im Frühjahr."; }
  else if(score <= 12){ level="B1"; advice="B2 bis Dezember ist möglich, aber hart. 2-3 Std/Tag, 6 Tage/Woche. Fokus: Sprechen + Schreiben."; }
  else { level="B1+ / B2-ready"; advice="B2 bis Dezember ist realistisch. Du brauchst vor allem Prüfungstraining und Sprechen."; }

  const r = document.getElementById("result");
  r.style.display = "block";
  r.innerHTML = "<div class='lv'>"+score+" / 16 — Level: "+level+"</div><p>"+advice+"</p>"
    + (unanswered ? "<p>"+unanswered+" Frage(n) offen gelassen.</p>" : "")
    + "<hr><div style='font-size:14px'>"+detail+"</div>"
    + "<hr><p style='font-size:14px'><b>Wichtig:</b> Dieser Test prüft nur Grammatik. "
    + "Kannst du 5 Minuten frei sprechen, ohne Englisch? Verstehst du einen deutschen Podcast in normalem Tempo? "
    + "Wenn nein, bist du niedriger als das Ergebnis hier.</p>";
}
</script>
</body>
</html>
