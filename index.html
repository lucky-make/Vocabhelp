<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaos in Berlin — Vocabulary</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0d0d;--paper:#f7f3ec;--cream:#ede8df;--gold:#b8860b;--gold-light:#d4a017;
  --green:#1a5c2a;--red:#8b1a1a;--grey:#6b6560;--line:#d4cfc7;
  --l1:#2c4a6e;--l2:#5c2a6e;--l3:#2a6e4a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh}

/* MASTHEAD */
.masthead{background:var(--ink);padding:32px 48px 24px;position:relative;overflow:hidden}
.masthead::before{content:'VOKABELN';position:absolute;font-family:'Playfair Display',serif;font-size:9rem;font-weight:700;color:rgba(255,255,255,0.03);top:-10px;right:-10px;pointer-events:none;letter-spacing:-4px}
.masthead-inner{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px}
.title-block h1{font-family:'Playfair Display',serif;font-size:2.4rem;font-weight:700;color:var(--paper);letter-spacing:-1px;line-height:1}
.title-block h1 em{font-style:italic;color:var(--gold-light)}
.title-block p{font-family:'DM Mono',monospace;font-size:0.65rem;letter-spacing:3px;color:#888;text-transform:uppercase;margin-top:6px}
.stats-row{display:flex;gap:24px;align-items:flex-end}
.stat{text-align:right}
.stat-num{font-family:'DM Mono',monospace;font-size:1.4rem;color:var(--gold-light);line-height:1}
.stat-label{font-family:'DM Mono',monospace;font-size:0.58rem;letter-spacing:2px;color:#666;text-transform:uppercase}

/* LAYER NAV */
.layer-nav{background:var(--cream);border-bottom:1px solid var(--line);padding:0 48px;display:flex;gap:0}
.layer-tab{font-family:'DM Mono',monospace;font-size:0.63rem;letter-spacing:2px;text-transform:uppercase;padding:14px 20px;border:none;background:transparent;color:var(--grey);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;white-space:nowrap}
.layer-tab:hover{color:var(--ink)}
.layer-tab.active{color:var(--ink);border-bottom-color:var(--gold);font-weight:500}
.layer-tab .layer-pip{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle}
.l1-pip{background:var(--l1)}.l2-pip{background:var(--l2)}.l3-pip{background:var(--l3)}

/* MAIN LAYOUT */
.main{max-width:700px;margin:0 auto;padding:40px 48px 120px}

/* SESSION INFO */
.session-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;flex-wrap:wrap;gap:12px}
.session-info{font-family:'DM Mono',monospace;font-size:0.68rem;color:var(--grey);letter-spacing:1px}
.session-info span{color:var(--gold);font-weight:500}
.session-controls{display:flex;gap:10px}
.ctrl-btn{font-family:'DM Mono',monospace;font-size:0.62rem;letter-spacing:2px;text-transform:uppercase;padding:8px 16px;border:1px solid var(--line);background:transparent;color:var(--grey);cursor:pointer;transition:all 0.2s}
.ctrl-btn:hover{border-color:var(--gold);color:var(--ink)}
.ctrl-btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ctrl-btn.primary:hover{background:#222}

/* PROGRESS BAR */
.progress-wrap{margin-bottom:32px}
.progress-track{height:2px;background:var(--line);margin-bottom:6px}
.progress-fill{height:100%;background:var(--gold-light);transition:width 0.4s}
.progress-label{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--grey);letter-spacing:1px;display:flex;justify-content:space-between}

/* CARD */
.card-wrap{perspective:1000px;margin-bottom:28px;min-height:280px}
.card{position:relative;width:100%;min-height:280px;transform-style:preserve-3d;transition:transform 0.5s cubic-bezier(0.4,0,0.2,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;min-height:280px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 32px;text-align:center}
.card-front{background:var(--ink);border-left:4px solid var(--gold)}
.card-back{background:var(--cream);border-left:4px solid var(--green);transform:rotateY(180deg)}
.card-layer-tag{font-family:'DM Mono',monospace;font-size:0.58rem;letter-spacing:3px;text-transform:uppercase;margin-bottom:20px;opacity:0.6}
.card-front .card-layer-tag{color:var(--gold-light)}
.card-back .card-layer-tag{color:var(--grey)}
.card-word{font-family:'Playfair Display',serif;font-size:2.8rem;font-weight:700;line-height:1.1;margin-bottom:12px}
.card-front .card-word{color:var(--paper)}
.card-back .card-word{color:var(--ink)}
.card-hint{font-family:'DM Mono',monospace;font-size:0.7rem;color:#666;letter-spacing:1px;margin-top:8px}
.card-front .card-hint{color:#555}
.card-translation{font-family:'DM Mono',monospace;font-size:0.9rem;color:var(--grey);letter-spacing:1px;margin-bottom:20px}
.card-example-de{font-family:'Playfair Display',serif;font-style:italic;font-size:1rem;color:var(--ink);margin-bottom:6px;line-height:1.5}
.card-example-en{font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--grey);letter-spacing:0.5px}
.flip-hint{font-family:'DM Mono',monospace;font-size:0.6rem;color:#555;letter-spacing:2px;text-transform:uppercase;margin-top:20px;opacity:0.7}
.speak-btn-card{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid rgba(212,160,23,0.3);background:transparent;cursor:pointer;color:var(--gold);margin-top:16px;transition:all 0.15s;border-radius:2px}
.speak-btn-card:hover{background:rgba(212,160,23,0.1)}
.speak-btn-card.speaking{color:var(--gold-light);border-color:var(--gold-light);animation:pulse-speak 0.7s infinite alternate}
.speak-btn-card svg{width:16px;height:16px;fill:currentColor}
@keyframes pulse-speak{from{opacity:1}to{opacity:0.4}}

/* ANSWER BUTTONS */
.answer-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:4px}
.ans-btn{font-family:'DM Mono',monospace;font-size:0.68rem;letter-spacing:2px;text-transform:uppercase;padding:14px 8px;border:1px solid var(--line);background:transparent;cursor:pointer;transition:all 0.2s;color:var(--grey);display:flex;flex-direction:column;align-items:center;gap:4px}
.ans-btn:hover{border-color:var(--gold);color:var(--ink)}
.ans-btn .ans-icon{font-size:1.2rem}
.ans-btn.again{border-color:var(--red);color:var(--red)}
.ans-btn.again:hover{background:var(--red);color:white}
.ans-btn.hard{border-color:#8B6914;color:#8B6914}
.ans-btn.hard:hover{background:#8B6914;color:white}
.ans-btn.good{border-color:var(--green);color:var(--green)}
.ans-btn.good:hover{background:var(--green);color:white}
.ans-btn .ans-interval{font-size:0.58rem;opacity:0.7}

/* WORD LIST */
.wordlist-wrap{margin-top:40px}
.wordlist-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:12px}
.wordlist-title{font-family:'DM Mono',monospace;font-size:0.62rem;letter-spacing:3px;text-transform:uppercase;color:var(--grey)}
.wordlist-toggle{font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:1px;color:var(--gold);background:none;border:none;cursor:pointer;text-decoration:underline}
.wordlist{display:none}
.wordlist.open{display:block}
.word-row{display:grid;grid-template-columns:1fr 1fr 20px;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.word-row:last-child{border-bottom:none}
.word-de{font-family:'Playfair Display',serif;font-size:0.95rem;font-weight:700}
.word-en{font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--grey)}
.word-status{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line);justify-self:center}
.word-status.known{background:var(--green);border-color:var(--green)}
.word-status.learning{background:var(--gold-light);border-color:var(--gold-light)}

/* DONE SCREEN */
.done-screen{display:none;text-align:center;padding:60px 0}
.done-screen.show{display:block}
.done-icon{font-size:3rem;margin-bottom:20px}
.done-title{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;margin-bottom:12px}
.done-sub{font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--grey);letter-spacing:1px;line-height:1.8;margin-bottom:32px}

/* EMPTY STATE */
.empty-state{text-align:center;padding:60px 20px;color:var(--grey)}
.empty-state p{font-family:'DM Mono',monospace;font-size:0.75rem;letter-spacing:1px;line-height:2}

/* AUDIO BAR */
.audio-bar{position:fixed;bottom:24px;right:24px;background:var(--ink);color:var(--paper);padding:10px 16px;display:flex;align-items:center;gap:12px;z-index:1000;font-family:'DM Mono',monospace;font-size:0.7rem;letter-spacing:1px;border-left:3px solid var(--gold);opacity:0;pointer-events:none;transition:opacity 0.3s;max-width:280px}
.audio-bar.visible{opacity:1;pointer-events:auto}
.audio-bar-stop{background:none;border:1px solid #444;color:#aaa;cursor:pointer;font-family:'DM Mono',monospace;font-size:0.62rem;padding:3px 8px;letter-spacing:1px}
.audio-bar-stop:hover{border-color:var(--gold);color:var(--gold)}

/* SAVE DOT */
.save-dot{width:6px;height:6px;border-radius:50%;background:var(--grey);display:inline-block;transition:background 0.3s;margin-left:6px}
.save-dot.saved{background:var(--green)}.save-dot.saving{background:var(--gold-light)}

@media(max-width:600px){
  .masthead,.main{padding-left:20px;padding-right:20px}
  .layer-nav{padding:0 20px}
  .card-word{font-size:2rem}
  .answer-row{grid-template-columns:1fr 1fr 1fr}
  .stats-row{gap:12px}
  .masthead-inner{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-inner">
    <div class="title-block">
      <h1>Chaos in <em>Berlin</em> — <em>Vokabeln</em></h1>
      <p>300 Essential Words &nbsp;·&nbsp; 3 Layers &nbsp;·&nbsp; 14 Days to Foundation</p>
    </div>
    <div class="stats-row">
      <div class="stat">
        <div class="stat-num" id="stat-known">0</div>
        <div class="stat-label">Known</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-learning">0</div>
        <div class="stat-label">Learning</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-due">0</div>
        <div class="stat-label">Due Today<span class="save-dot" id="save-dot"></span></div>
      </div>
    </div>
  </div>
</div>

<div class="layer-nav">
  <button class="layer-tab active" id="tab-study" onclick="setMode('study',this)">&#9654; Study Session</button>
  <button class="layer-tab" id="tab-l1" onclick="setMode('l1',this)"><span class="layer-pip l1-pip"></span>Layer 1 — Skeleton</button>
  <button class="layer-tab" id="tab-l2" onclick="setMode('l2',this)"><span class="layer-pip l2-pip"></span>Layer 2 — Verbs</button>
  <button class="layer-tab" id="tab-l3" onclick="setMode('l3',this)"><span class="layer-pip l3-pip"></span>Layer 3 — Nouns</button>
</div>

<div class="main">

  <!-- STUDY MODE -->
  <div id="mode-study">
    <div class="session-bar">
      <div class="session-info">Session: <span id="session-count">0</span> reviewed &nbsp;·&nbsp; <span id="queue-count">0</span> remaining</div>
      <div class="session-controls">
        <button class="ctrl-btn" onclick="shuffleQueue()">Shuffle</button>
        <button class="ctrl-btn primary" onclick="startSession()">New Session</button>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="session-progress" style="width:0%"></div></div>
      <div class="progress-label"><span id="prog-left">0 cards left</span><span id="prog-done">0 done</span></div>
    </div>

    <div id="study-area">
      <div class="card-wrap" id="card-wrap">
        <div class="card" id="main-card" onclick="flipCard()">
          <div class="card-face card-front">
            <div class="card-layer-tag" id="card-layer-tag">Layer 1 — Skeleton</div>
            <div class="card-word" id="card-word">—</div>
            <button class="speak-btn-card" id="speak-de-btn" title="Listen" onclick="event.stopPropagation();speakCurrent('de')">
              <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            </button>
            <div class="flip-hint">Tap to reveal</div>
          </div>
          <div class="card-face card-back">
            <div class="card-layer-tag" id="card-layer-tag-back">Layer 1</div>
            <div class="card-word" id="card-back-word">—</div>
            <div class="card-translation" id="card-translation">—</div>
            <div class="card-example-de" id="card-example-de">—</div>
            <div class="card-example-en" id="card-example-en">—</div>
            <button class="speak-btn-card" id="speak-ex-btn" title="Listen to example" onclick="event.stopPropagation();speakCurrent('ex')">
              <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="answer-row" id="answer-row" style="display:none">
        <button class="ans-btn again" onclick="rateCard(0)">
          <span class="ans-icon">✗</span>
          <span>Again</span>
          <span class="ans-interval">repeat now</span>
        </button>
        <button class="ans-btn hard" onclick="rateCard(1)">
          <span class="ans-icon">~</span>
          <span>Hard</span>
          <span class="ans-interval" id="int-hard">+1 day</span>
        </button>
        <button class="ans-btn good" onclick="rateCard(2)">
          <span class="ans-icon">✓</span>
          <span>Good</span>
          <span class="ans-interval" id="int-good">+3 days</span>
        </button>
      </div>
    </div>

    <div class="done-screen" id="done-screen">
      <div class="done-icon">🎯</div>
      <div class="done-title">Session Complete</div>
      <div class="done-sub" id="done-sub">—</div>
      <button class="ctrl-btn primary" onclick="startSession()" style="margin:0 auto">Start Another</button>
    </div>
  </div>

  <!-- LAYER BROWSE MODES -->
  <div id="mode-browse" style="display:none">
    <div class="wordlist-wrap">
      <div class="wordlist-header">
        <div class="wordlist-title" id="browse-title">Layer 1 — Skeleton (80 words)</div>
        <button class="wordlist-toggle" onclick="toggleList()">Show all</button>
      </div>
      <div class="wordlist" id="wordlist"></div>
    </div>
  </div>

</div>

<!-- AUDIO BAR -->
<div class="audio-bar" id="audio-bar">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="color:var(--gold);flex-shrink:0"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
  <span id="audio-bar-text" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#aaa">—</span>
  <button class="audio-bar-stop" onclick="stopSpeech()">&#9632;</button>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────

// ── STATE ─────────────────────────────────────────────────────────────────
const SAVE_KEY = 'cib_vocab_v2';
const LAYER_NAMES = {1:'Layer 1 — Skeleton', 2:'Layer 2 — Verbs', 3:'Layer 3 — Nouns & Adjectives'};
const LAYER_COUNTS = {1:96, 2:100, 3:103};

let state = {};  // id -> {interval, due, seen, correct}
let queue = [];
let currentIdx = 0;
let currentWord = null;
let flipped = false;
let sessionDone = 0;
let sessionTotal = 0;
let currentMode = 'study';
let saveTimer = null;

// ── INIT ──────────────────────────────────────────────────────────────────
function initState() {
  WORDS.forEach(w => {
    if (!state[w.id]) state[w.id] = {interval:0, due:0, seen:false, correct:0, total:0};
  });
}

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch(e) {}
  initState();
  updateStats();
}

function scheduleSave() {
  const dot = document.getElementById('save-dot');
  if(dot) dot.className = 'save-dot saving';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e) {}
    const dot = document.getElementById('save-dot');
    if(dot) { dot.className = 'save-dot saved'; setTimeout(()=>{if(dot)dot.className='save-dot';},2000); }
  }, 600);
}

// ── SRS LOGIC ─────────────────────────────────────────────────────────────
function isDue(id) {
  const s = state[id];
  if (!s.seen) return true;
  return Date.now() >= s.due;
}

function getInterval(current, rating) {
  if (rating === 0) return 0;  // again — immediate
  if (!current || current === 0) return rating === 1 ? 1 : 3;
  const next = rating === 1 ? Math.max(1, Math.floor(current * 1.3)) : Math.floor(current * 2.5);
  return Math.min(next, 180);
}

function rateCard(rating) {
  if (!currentWord) return;
  const s = state[currentWord.id];
  const newInterval = getInterval(s.interval, rating);
  s.seen = true;
  s.interval = newInterval;
  s.total = (s.total||0) + 1;
  if (rating >= 1) s.correct = (s.correct||0) + 1;
  if (rating === 0) {
    // push back into queue
    queue.push(currentWord);
  } else {
    s.due = Date.now() + newInterval * 86400000;
  }
  sessionDone++;
  scheduleSave();
  nextCard();
}

// ── SESSION ───────────────────────────────────────────────────────────────
function buildQueue(layerFilter) {
  let pool = WORDS.filter(w => layerFilter ? w.layer === layerFilter : true);
  // Due first, then unseen
  let due = pool.filter(w => isDue(w.id));
  // Limit session to 15 cards max for ADHD sanity
  queue = due.slice(0, 15);
  // Shuffle
  for (let i = queue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [queue[i], queue[j]] = [queue[j], queue[i]];
  }
  currentIdx = 0;
  sessionDone = 0;
  sessionTotal = queue.length;
}

function startSession(layerFilter) {
  buildQueue(layerFilter);
  document.getElementById('done-screen').classList.remove('show');
  document.getElementById('study-area').style.display = '';
  updateSessionProgress();
  if (queue.length === 0) {
    showDoneScreen(true);
    return;
  }
  loadCard(queue[currentIdx]);
}

function shuffleQueue() {
  for (let i = queue.slice(currentIdx).length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    const a = currentIdx + i, b = currentIdx + j;
    [queue[a], queue[b]] = [queue[b], queue[a]];
  }
  if (queue[currentIdx]) loadCard(queue[currentIdx]);
}

function nextCard() {
  currentIdx++;
  updateSessionProgress();
  if (currentIdx >= queue.length) {
    showDoneScreen(false);
    return;
  }
  loadCard(queue[currentIdx]);
}

function showDoneScreen(empty) {
  document.getElementById('study-area').style.display = 'none';
  const screen = document.getElementById('done-screen');
  screen.classList.add('show');
  const known = WORDS.filter(w => state[w.id] && state[w.id].seen && state[w.id].interval > 3).length;
  document.getElementById('done-sub').innerHTML =
    (empty ? 'No cards due right now. Come back later or browse the layers.<br><br>' : '') +
    sessionDone + ' cards reviewed this session.<br>' +
    known + ' words with interval > 3 days.<br>' +
    WORDS.filter(w => state[w.id]?.seen).length + ' / ' + WORDS.length + ' words seen.';
  updateStats();
}

// ── CARD DISPLAY ──────────────────────────────────────────────────────────
function loadCard(word) {
  currentWord = word;
  flipped = false;
  const card = document.getElementById('main-card');
  card.classList.remove('flipped');
  document.getElementById('answer-row').style.display = 'none';

  const layerNames = {1:'Layer 1 — Skeleton', 2:'Layer 2 — Verbs', 3:'Layer 3 — Nouns & Adjectives'};
  document.getElementById('card-layer-tag').textContent = layerNames[word.layer];
  document.getElementById('card-layer-tag-back').textContent = layerNames[word.layer];
  document.getElementById('card-word').textContent = word.de;
  document.getElementById('card-back-word').textContent = word.de;
  document.getElementById('card-translation').textContent = word.en;
  document.getElementById('card-example-de').textContent = word.ex_de;
  document.getElementById('card-example-en').textContent = word.ex_en;

  // Interval hints
  const s = state[word.id];
  const curr = s.interval || 0;
  document.getElementById('int-hard').textContent = '+' + getInterval(curr,1) + 'd';
  document.getElementById('int-good').textContent = '+' + getInterval(curr,2) + 'd';
  document.getElementById('speak-de-btn').classList.remove('speaking');
  document.getElementById('speak-ex-btn').classList.remove('speaking');
}

function flipCard() {
  if (!currentWord) return;
  flipped = !flipped;
  document.getElementById('main-card').classList.toggle('flipped', flipped);
  document.getElementById('answer-row').style.display = flipped ? 'grid' : 'none';
  if (flipped) speakCurrent('de');
}

// ── STATS ─────────────────────────────────────────────────────────────────
function updateStats() {
  const known = WORDS.filter(w => state[w.id]?.seen && state[w.id]?.interval > 3).length;
  const learning = WORDS.filter(w => state[w.id]?.seen && (state[w.id]?.interval||0) <= 3).length;
  const due = WORDS.filter(w => isDue(w.id)).length;
  document.getElementById('stat-known').textContent = known;
  document.getElementById('stat-learning').textContent = learning;
  document.getElementById('stat-due').textContent = due;
}

function updateSessionProgress() {
  const left = queue.length - currentIdx;
  const done = sessionDone;
  const total = sessionTotal || 1;
  const pct = Math.round((done / total) * 100);
  document.getElementById('session-progress').style.width = pct + '%';
  document.getElementById('prog-left').textContent = left + ' cards left';
  document.getElementById('prog-done').textContent = done + ' done';
  document.getElementById('session-count').textContent = sessionDone;
  document.getElementById('queue-count').textContent = Math.max(0, queue.length - currentIdx);
}

// ── MODE SWITCHING ─────────────────────────────────────────────────────────
function setMode(mode, tab) {
  document.querySelectorAll('.layer-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentMode = mode;
  document.getElementById('mode-study').style.display = mode === 'study' ? '' : 'none';
  document.getElementById('mode-browse').style.display = mode !== 'study' ? '' : 'none';
  if (mode === 'study') {
    startSession();
  } else {
    const layerNum = parseInt(mode.replace('l',''));
    showBrowse(layerNum);
  }
}

function showBrowse(layer) {
  const words = WORDS.filter(w => w.layer === layer);
  const counts = {1:'96',2:'100',3:'103'};
  document.getElementById('browse-title').textContent = LAYER_NAMES[layer] + ' (' + words.length + ' words)';
  const list = document.getElementById('wordlist');
  list.innerHTML = words.map(w => {
    const s = state[w.id];
    const statusClass = !s?.seen ? '' : s.interval > 3 ? 'known' : 'learning';
    return `<div class="word-row">
      <div class="word-de">${w.de}</div>
      <div class="word-en">${w.en}</div>
      <div class="word-status ${statusClass}"></div>
    </div>`;
  }).join('');
}

function toggleList() {
  const list = document.getElementById('wordlist');
  const btn = document.querySelector('.wordlist-toggle');
  list.classList.toggle('open');
  btn.textContent = list.classList.contains('open') ? 'Hide' : 'Show all';
}

// ── AUDIO ──────────────────────────────────────────────────────────────────
let deVoice = null;
let currentSpeakBtn = null;
function loadVoices() {
  const v = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  deVoice = v.find(x=>x.lang==='de-DE'&&/female|anna|petra|marlene/i.test(x.name))||v.find(x=>x.lang==='de-DE')||v.find(x=>x.lang.startsWith('de'));
}
if(window.speechSynthesis){loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices;}

function stopSpeech() {
  if(window.speechSynthesis)window.speechSynthesis.cancel();
  if(currentSpeakBtn){currentSpeakBtn.classList.remove('speaking');currentSpeakBtn=null;}
  document.getElementById('audio-bar').classList.remove('visible');
}

function speakText(text, btn) {
  if(!window.speechSynthesis)return;
  stopSpeech();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang='de-DE';utt.rate=0.8;utt.pitch=1.0;
  if(deVoice)utt.voice=deVoice;
  utt.onstart=()=>{
    currentSpeakBtn=btn;btn.classList.add('speaking');
    document.getElementById('audio-bar-text').textContent=text.length>35?text.slice(0,35)+'...':text;
    document.getElementById('audio-bar').classList.add('visible');
  };
  utt.onend=utt.onerror=()=>{
    btn.classList.remove('speaking');currentSpeakBtn=null;
    document.getElementById('audio-bar').classList.remove('visible');
  };
  window.speechSynthesis.speak(utt);
}

function speakCurrent(which) {
  if(!currentWord)return;
  const text = which==='ex' ? currentWord.ex_de : currentWord.de;
  const btn = which==='ex' ? document.getElementById('speak-ex-btn') : document.getElementById('speak-de-btn');
  speakText(text, btn);
}

// ── KEYBOARD ──────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if(currentMode !== 'study') return;
  if(e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
  if(flipped) {
    if(e.key==='1') rateCard(0);
    if(e.key==='2') rateCard(1);
    if(e.key==='3') rateCard(2);
  }
});

// ── CLEAR PROGRESS ────────────────────────────────────────────────────────
window.clearVocabProgress = function() {
  if(confirm('Reset all vocab progress?')) { localStorage.removeItem(SAVE_KEY); location.reload(); }
};

// ── BOOT ──────────────────────────────────────────────────────────────────
loadSave();
startSession();
</script>
